<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>
<meta name="description" content="Portfolio">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="scroll-progress" data-scroll-progress></div>

  <header class="site-header" data-header>
    <a class="site-header__logo" href="#top">
      <span class="site-header__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 0c.6 4.9 2.1 6.4 7 7-4.9.6-6.4 2.1-7 7-.6-4.9-2.1-6.4-7-7 4.9-.6 6.4-2.1 7-7z" fill="currentColor"/></svg>
      </span>
      <span data-name></span>
    </a>
    <nav class="site-header__nav">
      <a href="#about">About</a>
      <a href="#approach">Approach</a>
      <a href="#experience">Experience</a>
      <a href="#contact">Contact</a>
    </nav>
    <a class="site-header__cta btn-glow" href="#contact">Get in touch</a>
    <button class="site-header__toggle" data-menu-toggle aria-label="Open menu" aria-expanded="false" aria-controls="mobile-nav">
      <span></span><span></span><span></span>
    </button>
  </header>

  <div class="mobile-nav" id="mobile-nav" data-mobile-nav>
    <a href="#about" data-mobile-link>About</a>
    <a href="#approach" data-mobile-link>Approach</a>
    <a href="#experience" data-mobile-link>Experience</a>
    <a href="#contact" data-mobile-link>Contact</a>
    <a class="mobile-nav__cta btn-glow" href="#contact" data-mobile-link>Get in touch</a>
  </div>

  <main id="top">

    <section class="hero" id="hero">
      <div class="hero__bg" data-parallax>
        <div class="hero__streak"></div>
        <div class="hero__grain"></div>
      </div>
      <div class="hero__content">
        <h1 class="hero__headline" data-headline></h1>
        <p class="hero__sub" data-sub></p>
        <a class="hero__cta btn-glow" href="#approach" data-cta></a>
      </div>
    </section>

    <section class="tabs" id="about">
      <p class="eyebrow-plain reveal" data-tabs-eyebrow></p>
      <h2 class="section-heading reveal" data-tabs-heading></h2>

      <div class="tabs__nav" data-tabs-nav></div>

      <div class="tabs__panel">
        <div class="tabs__visual" data-tabs-visual></div>
        <div class="tabs__copy" data-tabs-copy></div>
      </div>
    </section>

    <section class="approach" id="approach">
      <h2 class="section-heading reveal" data-approach-heading></h2>
      <ol class="steps" data-steps>
        <div class="steps__line"><div class="steps__line-fill" data-steps-fill></div></div>
      </ol>
    </section>

    <section class="stats" id="experience">
      <div class="stats__grid" data-stats></div>
    </section>

    <section class="testimonials" id="testimonials">
      <h2 class="section-heading reveal" data-testimonials-heading></h2>
      <div class="testimonials__grid" data-testimonials-grid></div>
    </section>

    <section class="faq" id="faq">
      <h2 class="section-heading reveal" data-faq-heading></h2>
      <div class="faq__list" data-faq-list></div>
    </section>

    <section class="contact" id="contact">
      <h2 class="section-heading reveal" data-contact-heading></h2>
      <a class="contact__email reveal" data-email href="#"></a>
      <ul class="contact__socials reveal" data-socials></ul>
    </section>

  </main>

  <footer class="site-footer">
    <span data-footer-name></span>
    <span data-year></span>
  </footer>

<script src="script.js"></script>
</body>
</html>
